---
- name: Deploy Monitoring Stack (Prometheus + Grafana + Cloudflare Tunnel)
  hosts: monitoring
  become: yes

  vars:
    # ----------------------------
    # Prometheus
    # ----------------------------
    prometheus_config_dir: /opt/prometheus
    prometheus_image: prom/prometheus:v2.51.0
    node_exporter_target: "10.0.0.5:9100"

    # ----------------------------
    # Grafana
    # ----------------------------
    grafana_data_dir: /opt/grafana
    grafana_image: grafana/grafana:latest

    # ----------------------------
    # Cloudflare Tunnel
    # ----------------------------
    cloudflared_bin: /usr/local/bin/cloudflared
    cloudflared_config_dir: /etc/cloudflared

    # 🔐 Provided at runtime (not in Git)
    cloudflare_tunnel_token: "{{ lookup('env', 'CLOUDFLARE_TUNNEL_TOKEN') }}"
    grafana_hostname: "monitoring.azraiidris.com"

  tasks:
    # ----------------------------
    # Base setup
    # ----------------------------
    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install required packages
      apt:
        name:
          - docker.io
          - curl
        state: present

    - name: Ensure Docker is running
      service:
        name: docker
        state: started
        enabled: yes

    # ----------------------------
    # Prometheus
    # ----------------------------
    - name: Create Prometheus config directory
      file:
        path: "{{ prometheus_config_dir }}"
        state: directory
        mode: '0755'

    - name: Create Prometheus config
      copy:
        dest: "{{ prometheus_config_dir }}/prometheus.yml"
        content: |
          global:
            scrape_interval: 15s

          scrape_configs:
            - job_name: "node_exporter"
              static_configs:
                - targets: ["{{ node_exporter_target }}"]

    - name: Run Prometheus container (host network)
      docker_container:
        name: prometheus
        image: "{{ prometheus_image }}"
        state: started
        restart_policy: always
        network_mode: host
        volumes:
          - "{{ prometheus_config_dir }}/prometheus.yml:/etc/prometheus/prometheus.yml"

    # ----------------------------
    # Grafana provisioning
    # ----------------------------
    - name: Create Grafana directories
      file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ grafana_data_dir }}"
        - "{{ grafana_data_dir }}/provisioning"
        - "{{ grafana_data_dir }}/provisioning/datasources"
        - "{{ grafana_data_dir }}/provisioning/dashboards"

    - name: Set Grafana directory ownership
      file:
        path: "{{ grafana_data_dir }}"
        owner: 472
        group: 472
        recurse: yes

    - name: Create Grafana datasource
      copy:
        dest: "{{ grafana_data_dir }}/provisioning/datasources/prometheus.yml"
        content: |
          apiVersion: 1
          datasources:
            - name: Prometheus
              type: prometheus
              access: proxy
              url: http://localhost:9090
              isDefault: true

    - name: Create Grafana dashboard provider
      copy:
        dest: "{{ grafana_data_dir }}/provisioning/dashboards/dashboards.yml"
        content: |
          apiVersion: 1
          providers:
            - name: default
              orgId: 1
              folder: ""
              type: file
              editable: true
              options:
                path: /var/lib/grafana/provisioning/dashboards

    - name: Download Node Exporter dashboard
      get_url:
        url: https://grafana.com/api/dashboards/1860/revisions/37/download
        dest: "{{ grafana_data_dir }}/provisioning/dashboards/node-exporter.json"
        mode: '0644'

    - name: Run Grafana container (host network)
      docker_container:
        name: grafana
        image: "{{ grafana_image }}"
        state: started
        restart_policy: always
        network_mode: host
        volumes:
          - "{{ grafana_data_dir }}:/var/lib/grafana"
          - "{{ grafana_data_dir }}/provisioning:/var/lib/grafana/provisioning"

    # ----------------------------
    # Health checks
    # ----------------------------
    - name: Wait for Prometheus
      wait_for:
        host: 127.0.0.1
        port: 9090
        timeout: 120

    - name: Wait for Grafana
      wait_for:
        host: 127.0.0.1
        port: 3000
        timeout: 120

    # ----------------------------
    # Cloudflare Tunnel
    # ----------------------------
    - name: Download cloudflared
      get_url:
        url: https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
        dest: "{{ cloudflared_bin }}"
        mode: '0755'

    - name: Create cloudflared systemd service
      copy:
        dest: /etc/systemd/system/cloudflared.service
        content: |
          [Unit]
          Description=Cloudflare Tunnel
          After=network.target

          [Service]
          ExecStart={{ cloudflared_bin }} tunnel run --token {{ cloudflare_tunnel_token }}
          Restart=always
          User=root

          [Install]
          WantedBy=multi-user.target

    - name: Enable and start cloudflared
      systemd:
        name: cloudflared
        daemon_reload: yes
        enabled: yes
        state: started

    # ----------------------------
    # Output
    # ----------------------------
    - name: Show monitoring URL
      debug:
        msg: "Monitoring available at https://{{ grafana_hostname }}"
